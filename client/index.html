<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Medical Care Germany - Berlin-based Clinical Coordination</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Structured access to Germany's most advanced medical system. Berlin-based clinical coordination for complex, serious, and high-priority international patient cases." />
    <meta name="keywords" content="medical care germany, berlin medical coordination, german hospitals, international patients, medical treatment germany, clinical coordination" />
    <meta name="author" content="Medical Care Germany" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.medicalcaregermany.com" />
    
    <!-- Open Graph Meta Tags (Social Media) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.medicalcaregermany.com" />
    <meta property="og:title" content="Medical Care Germany - Berlin-based Clinical Coordination" />
    <meta property="og:description" content="Structured access to Germany's most advanced medical system. Berlin-based clinical coordination for complex, serious, and high-priority international patient cases." />
    <meta property="og:site_name" content="Medical Care Germany" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.medicalcaregermany.com" />
    <meta name="twitter:title" content="Medical Care Germany - Berlin-based Clinical Coordination" />
    <meta name="twitter:description" content="Structured access to Germany's most advanced medical system. Berlin-based clinical coordination for complex, serious, and high-priority international patient cases." />
    
    <!-- Structured Data (JSON-LD) for Medical Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MedicalOrganization",
      "name": "Medical Care Germany",
      "alternateName": "Berlin Medical Care",
      "url": "https://www.medicalcaregermany.com",
      "logo": "https://www.medicalcaregermany.com/logo.png",
      "description": "Structured access to Germany's most advanced medical system. Berlin-based clinical coordination for complex, serious, and high-priority international patient cases.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Perleberger Str. 41",
        "addressLocality": "Berlin",
        "postalCode": "10559",
        "addressCountry": "DE"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+49-30-25730875",
        "contactType": "customer service",
        "email": "info@medicalcaregermany.com",
        "availableLanguage": ["English", "German", "Arabic"]
      },
      "sameAs": [
        "https://www.medicalcaregermany.com"
      ]
    }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Playfair Display (Authority), Inter (Clean), Cairo (Arabic) -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>

    <script
      defer

  </body>

</html>
