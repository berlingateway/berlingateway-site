<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- SEO Authority Pack - Primary Meta Tags -->
    <title>Medical Care Germany | Strategic Medical Authority for Complex Cases</title>
    <meta name="title" content="Medical Care Germany | Strategic Medical Authority for Complex Cases" />
    <meta name="description" content="Cross-border medical authority structuring priority access to Germany's leading specialists and university hospitals for international patients." />
    <meta name="keywords" content="medical care germany, berlin medical coordination, german hospitals, international patients, medical treatment germany, clinical coordination, premium medical services" />
    <meta name="author" content="Medical Care Germany" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    
    <!-- Canonical URL (Enforce www subdomain) -->
    <link rel="canonical" href="https://www.medicalcaregermany.com" />
    
    <!-- Open Graph Meta Tags (Premium Positioning) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.medicalcaregermany.com" />
    <meta property="og:title" content="Medical Care Germany | Strategic Medical Authority for Complex Cases" />
    <meta property="og:description" content="Cross-border medical authority structuring priority access to Germany's leading specialists and university hospitals for international patients." />
    <meta property="og:image" content="https://www.medicalcaregermany.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Medical Care Germany - Premium Medical Coordination" />
    <meta property="og:site_name" content="Medical Care Germany" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="de_DE" />
    <meta property="og:locale:alternate" content="ar_AR" />
    
    <!-- Twitter Card Meta Tags (High-Trust Sharing) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.medicalcaregermany.com" />
    <meta name="twitter:title" content="Medical Care Germany | Strategic Medical Authority for Complex Cases" />
    <meta name="twitter:description" content="Cross-border medical authority structuring priority access to Germany's leading specialists and university hospitals for international patients." />
    <meta name="twitter:image" content="https://www.medicalcaregermany.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="Medical Care Germany - Premium Medical Coordination" />
    
    <!-- Structured Data (JSON-LD) - MedicalOrganization Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MedicalOrganization",
      "name": "Medical Care Germany",
      "url": "https://www.medicalcaregermany.com",
      "logo": "https://www.medicalcaregermany.com/logo.png",
      "description": "Germany's premier medical coordination authority for international patients requiring complex, high-priority medical interventions.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Perleberger Str. 41",
        "addressLocality": "Berlin",
        "postalCode": "10559",
        "addressCountry": "DE"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+49-30-25730875",
        "contactType": "customer service",
        "email": "info@medicalcaregermany.com",
        "availableLanguage": ["English", "German", "Arabic"]
      },
      "sameAs": [
        "https://www.facebook.com/medicalcaregermany",
        "https://www.linkedin.com/company/medical-care-germany"
      ]
    }
    </script>
    
    <!-- Structured Data (JSON-LD) - WebSite Schema with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Medical Care Germany",
      "url": "https://www.medicalcaregermany.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.medicalcaregermany.com/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Playfair Display (Authority), Inter (Clean), Cairo (Arabic), IBM Plex Sans Arabic (RTL) -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500&family=Cairo:wght@300;400;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500&display=swap" rel="stylesheet" />
    
    <!-- Safe minimal badge removal (whitelisted, targeted) -->
    <script src="/remove-badge.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
