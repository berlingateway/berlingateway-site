<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>استلمنا ملفك — Medical Care Germany</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #ffffff;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .container {
      max-width: 560px;
      width: 100%;
      text-align: center;
    }
    .checkmark {
      width: 56px;
      height: 56px;
      background: #1a1a1a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
    }
    .checkmark svg {
      width: 28px;
      height: 28px;
      stroke: #ffffff;
    }
    h1 {
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 0.02em;
      margin-bottom: 20px;
      color: #1a1a1a;
    }
    .divider {
      width: 60px;
      height: 1px;
      background: #d1d5db;
      margin: 0 auto 24px;
    }
    p {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      line-height: 1.7;
      color: #4b5563;
      margin-bottom: 16px;
    }
    .contact-fallback {
      font-size: 13px;
      color: #6b7280;
      margin-top: 24px;
    }
    .contact-fallback a {
      color: #1a1a1a;
      text-decoration: underline;
    }
    .back-link {
      display: inline-block;
      margin-top: 40px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6b7280;
      text-decoration: none;
      border-bottom: 1px solid #d1d5db;
      padding-bottom: 2px;
    }
    .back-link:hover {
      color: #1a1a1a;
      border-color: #1a1a1a;
    }
    footer {
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="checkmark">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
      </svg>
    </div>

    <h1>استلمنا ملفك.</h1>
    <div class="divider"></div>

    <p>
      سيتواصل معك منسق طبي خلال 24 ساعة.
    </p>

    <p class="contact-fallback">
      للتواصل المباشر:
      <a href="mailto:info@medicalcaregermany.com">info@medicalcaregermany.com</a>
    </p>

    <a href="https://medicalcaregermany.com/ar" class="back-link">العودة للصفحة الرئيسية</a>
  </div>

  <footer>Medical Care Germany &mdash; Strategic Medical Advisory</footer>
</body>
</html>
